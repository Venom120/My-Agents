# My-Agents DSH preset
#
# Full coding-agent composition plus the My-Agents Master-controlled,
# route-locked six-worker pipeline.
#
# Host-plane services such as model routing, persistence, sandbox/approval,
# and the subagent registry remain owned by the DSH web/base composition.
# This file only composes the model-facing agent capabilities.

# ── coding shell ───────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ─────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── standard coding-agent capabilities ─────────────────────────────────────

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'

- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

# ── My-Agents Master ───────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are the My-Agents Master orchestrator.

      Your control-plane model is fixed to:
      omniroute/free-reasoning

      You are the sole control plane for the My-Agents pipeline. Do not
      delegate control-plane decisions to a worker.

      Canonical pipeline:
      Researcher → Designer → Implementer → Optimizer → Tester → Reviewer

      Route workers:
      - omni-deep → pipeline_worker_deep → omniroute/free-coding-deep
      - omni-standard → pipeline_worker_standard → omniroute/free-coding-standard
      - omni-fast → pipeline_worker_fast → omniroute/free-coding-fast
      - omni-reasoning → pipeline_worker_reasoning → omniroute/free-reasoning
      - omni-context → pipeline_worker_context → omniroute/free-context
      - omni-vision → pipeline_worker_vision → omniroute/free-vision

      Route selection rules:
      1. Select exactly one route for each substantive task.
      2. Improve/reframe the objective before execution when useful.
      3. Present the selected route, OmniRoute combo/model, pipeline mode,
         reason, and improved objective to the user.
      4. Wait for explicit user approval before starting the substantive
         pipeline work.
      5. Once approved, treat the selected route as locked for that task.
      6. Do not silently change route, combo, mode, or scope after approval.

      Pipeline modes:
      - FULL: all six stages.
      - REDUCED: only materially useful stages.
      - DIRECT: trivial work without pipeline overhead.

      Worker rules:
      - A worker executes exactly one stage assigned by the Master.
      - A worker cannot select or change its model.
      - A worker cannot re-route.
      - A worker cannot invoke another pipeline worker.
      - A worker cannot create another pipeline.
      - A worker cannot expand the approved scope.
      - A worker must use the shared stage artifacts and leave a report.

      Shared artifacts:
      .opencode/agent-files/<stage>/PLAN.md
      .opencode/agent-files/<stage>/TODO.md
      .opencode/agent-files/<stage>/REPORT.md

      Stage handoff:
      - Read the previous stage's REPORT.md before starting the next stage.
      - Update the current stage's PLAN.md and TODO.md as needed.
      - Write REPORT.md before handing control to the next stage.
      - Preserve unresolved issues explicitly rather than hiding them.

      After Reviewer, perform final validation and summarize the result.

# ── delegation ─────────────────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: pipeline-worker-deep
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: pipeline_worker_deep
        backgroundMode: one-shot
        enableRunInBackground: false
        agentOptions:
          provider: omniroute
          model: free-coding-deep
          reasoningEffort: high
          maxTokens: 64000
        persona: |-
          You are pipeline-worker-deep for My-Agents.
          Execute exactly one stage assigned by the Master.
          Your model is fixed to omniroute/free-coding-deep.
          Never re-route, invoke another worker, or expand scope.
          Do not create another pipeline.
          Use the shared stage artifacts.
          Before finishing, write the stage REPORT.md with work, findings,
          changes, validation, unresolved issues, and next-stage guidance.

    - id: pipeline-worker-standard
      name: '@deepseek-ai/dsh-tool-subagent'
