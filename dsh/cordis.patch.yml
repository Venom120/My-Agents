# My-Agents DSH bundle
#
# The preset-sync plugin is loaded from the installed My-Agents package so
# its path is stable regardless of the DSH profile working directory.
#
# The web profile already provides an `agent-presets` row. Override that
# existing row instead of inserting another row with the same id.

- insert:
    - id: my-agents-preset-sync
      name: my-agents-opencode-plugin/dsh-sync

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: my-agents
    includeShippedRoot: true
    includeUserRoot: true