# My-Agents DSH bundle
#
# This bundle keeps the Git repository as the source of truth. On load it
# synchronizes dsh/agent-presets/my-agents into $DSH_HOME/.agent-presets/my-agents.

- insert:
    - id: my-agents-preset-sync
      name: ./sync-preset.js

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: my-agents
        includeShippedRoot: true
        includeUserRoot: true
