# My-Agents DSH bundle
#
# The preset-sync plugin copies the My-Agents preset into:
#   $DSH_HOME/.agent-presets/my-agents
#
# The web profile already provides an `agent-presets` row.
# Override that existing row instead of inserting another row with
# the same id.

- insert:
    - id: my-agents-preset-sync
      name: ./sync-preset.js

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: my-agents
    includeShippedRoot: true
    includeUserRoot: true